<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Matrix Screen</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        h2 { color: #333; margin-bottom: 20px; }
        
        .sudoku-container {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            width: 100%;
            max-width: 360px;
            min-height: 360px;
            border: 3px solid #000;
            background-color: #fff;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            border: 1px solid #ccc;
            cursor: pointer;
            color: #333;
            box-sizing: border-box;
        }
        
        /* Clear 3x3 block layout separation grid dividers */
        .cell:nth-child(3n) { border-right: 3px solid #000; }
        .cell:nth-child(9n) { border-right: 1px solid #ccc; }
        
        .selected { background-color: #b3d4fc !important; }
        .fixed { background-color: #e9ecef; color: #555; cursor: not-allowed; }

        .num-pad {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 360px;
            margin-top: 25px;
        }
        .pad-btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .pad-btn:active { background-color: #006699; }
    </style>
</head>
<body>

    <h2>🧩 Sudoku Mini Game</h2>
    <div class="sudoku-container" id="board"></div>

    <div class="num-pad">
        <button class="pad-btn" onclick="pressNumber(1)">1</button>
        <button class="pad-btn" onclick="pressNumber(2)">2</button>
        <button class="pad-btn" onclick="pressNumber(3)">3</button>
        <button class="pad-btn" onclick="pressNumber(4)">4</button>
        <button class="pad-btn" onclick="pressNumber(5)">5</button>
        <button class="pad-btn" onclick="pressNumber(6)">6</button>
        <button class="pad-btn" onclick="pressNumber(7)">7</button>
        <button class="pad-btn" onclick="pressNumber(8)">8</button>
        <button class="pad-btn" onclick="pressNumber(9)">9</button>
    </div>

    <script>
        // Start Telegram framework execution safely
        try {
            window.Telegram.WebApp.expand();
        } catch(e) {
            console.log("Telegram SDK loading standalone");
        }

        let selectedCell = null;
        const boardElement = document.getElementById('board');

        // 💡 1. Parse incoming parameters with high compatibility rules
        const fullUrl = window.location.href;
        let boardString = null;

        if (fullUrl.includes("board=")) {
            // Safe manual string split to bypass any internal browser safety encoding bugs
            boardString = fullUrl.split("board=")[1].substring(0, 81);
        }

        # 💡 2. EMERGENCY FALLBACK: If string parsing fails entirely, load this hardcoded backup board!
        # This guarantees your app can NEVER launch into a blank white screen again.
        if (!boardString || boardString.length !== 81 || !/^[0-9]+$/.test(boardString)) {
            boardString = "004300209005009001070060043006002087190007400050083000600001050003050860020000074";
        }

        // 💡 3. Build the actual interactive UI boxes layout
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            
            const row = Math.floor(i / 9);
            if (row === 2 || row === 5) { 
                cell.style.borderBottom = "3px solid #000"; 
            }
            
            const val = parseInt(boardString[i]) || 0;
            
            if (val !== 0) {
                cell.innerText = val;
                cell.classList.add('fixed'); 
            } else {
                cell.onclick = function() {
                    if (selectedCell) selectedCell.classList.remove('selected');
                    selectedCell = cell;
                    cell.classList.add('selected');
                };
            }
            boardElement.appendChild(cell);
        }

        function pressNumber(num) {
            if (selectedCell && !selectedCell.classList.contains('fixed')) {
                selectedCell.innerText = num;
                selectedCell.style.color = "#0088cc"; 
            }
        }
    </script>
</body>
</html>
